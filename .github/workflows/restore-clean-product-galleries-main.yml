name: Restore clean product galleries

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.ref == 'fix/restore-clean-product-galleries'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore clean catalogue galleries
        shell: bash
        run: |
          git checkout 0c426cd7f3d88147efebbd27a07cb07e72d52f6a -- \
            public/images/products \
            public/products/KR01-0008/source \
            src/data/products

          for file in src/data/products/kr01-*.ts; do
            perl -0pi -e "s/^\s*factoryCode:\s*.*\n//mg; s/^\s*factoryStyleNumber:\s*.*\n//mg; s/Factory style [A-Za-z0-9-]+ is/This product is/gi; s/,?\s*factory style [A-Za-z0-9-]+//gi; s/Supplier style [A-Za-z0-9-]+/KARUU product/gi; s/\n\s*sizeChart:\s*\{.*?\n\s*\},\n/\n/sg" "$file"
          done
          perl -0pi -e "s/^\s*factoryCode:\s*string;\s*\n//mg; s/^\s*factoryStyleNumber:\s*string;\s*\n//mg; s/^\s*sizeChart\?:\s*ProductSizeChart;\s*\n//mg" src/data/products/types.ts

          find public/images/products -type f \( -iname '*size-chart*' -o -iname '*size_chart*' -o -iname '*sizechart*' \) -delete

      - name: Publish KR01-0008 under English asset paths
        shell: bash
        run: |
          mkdir -p public/images/products/kr01-0008
          cp 'public/products/KR01-0008/source/color-blue/绿色 (1).jpg' \
            public/images/products/kr01-0008/01-aqua-print.jpg
          cp 'public/products/KR01-0008/source/color-black-leopard/黑色豹纹 (1).jpg' \
            public/images/products/kr01-0008/02-black-leopard.jpg
          cp 'public/products/KR01-0008/source/color-pastel-leopard/灰色 (1).jpg' \
            public/images/products/kr01-0008/03-pastel-print.jpg
          cp 'public/products/KR01-0008/source/color-pink/粉 (1).jpg' \
            public/images/products/kr01-0008/04-pink-print.jpg
          cp 'public/products/KR01-0008/source/color-polka-dot/波点 (1).jpg' \
            public/images/products/kr01-0008/05-polka-dot.jpg

          node <<'NODE'
          const fs = require('fs');
          const file = 'src/data/products/kr01-0008.ts';
          let source = fs.readFileSync(file, 'utf8');
          source = source
            .replace("const imageBase = '/products/KR01-0008/source';", "const imageBase = '/images/products/kr01-0008';")
            .replace("${imageBase}/color-blue/绿色 (1).jpg", "${imageBase}/01-aqua-print.jpg")
            .replace("${imageBase}/color-black-leopard/黑色豹纹 (1).jpg", "${imageBase}/02-black-leopard.jpg")
            .replace("${imageBase}/color-pastel-leopard/灰色 (1).jpg", "${imageBase}/03-pastel-print.jpg")
            .replace("${imageBase}/color-pink/粉 (1).jpg", "${imageBase}/04-pink-print.jpg")
            .replace("${imageBase}/color-polka-dot/波点 (1).jpg", "${imageBase}/05-polka-dot.jpg");
          fs.writeFileSync(file, source);
          NODE

          rm -rf public/products/KR01-0008

      - name: Create English KR01-0012 detail graphics
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick fonts-dejavu-core

          convert public/images/products/kr01-0012/01-butter-yellow.jpg \
            -resize '1400x2100^' -gravity center -extent 1400x2100 \
            \( -size 1400x620 xc:'#173c5cdd' \) -gravity south -composite \
            -font DejaVu-Sans-Bold -fill white -pointsize 66 -gravity southwest \
            -annotate +90+430 'SEAMLESS KNIT CONSTRUCTION' \
            -font DejaVu-Sans -pointsize 42 -fill '#f3f6f8' \
            -annotate +90+330 'Smooth close-to-body fit' \
            -annotate +90+255 'Four-way stretch' \
            -annotate +90+180 'Breathable quick-dry fabric' \
            -quality 92 public/images/products/kr01-0012/07-detail-seamless-knit.jpg

          convert public/images/products/kr01-0012/02-light-pink.jpg \
            -resize '1400x2100^' -gravity center -extent 1400x2100 \
            \( -size 1400x620 xc:'#173c5cdd' \) -gravity south -composite \
            -font DejaVu-Sans-Bold -fill white -pointsize 66 -gravity southwest \
            -annotate +90+430 'PERFORMANCE FABRIC' \
            -font DejaVu-Sans -pointsize 42 -fill '#f3f6f8' \
            -annotate +90+330 'Moisture-wicking performance' \
            -annotate +90+255 'Soft skin-friendly hand feel' \
            -annotate +90+180 'Designed for yoga and training' \
            -quality 92 public/images/products/kr01-0012/08-detail-fabric-stretch.jpg

      - name: Validate and build
        shell: bash
        run: |
          if grep -RniE 'factoryStyleNumber|factoryCode|Factory Style|Supplier Style|factory style|supplier style' src/app src/components src/data/products src/lib; then
            echo 'Supplier identifier detected in public source.'
            exit 1
          fi
          if find public -type f | grep -Ei 'size[-_]?chart|sizechart'; then
            echo 'Source-language size chart still present.'
            exit 1
          fi
          if find public -type f | grep -P '[\x{3400}-\x{4DBF}\x{4E00}-\x{9FFF}\x{F900}-\x{FAFF}]'; then
            echo 'Public asset path containing Chinese characters detected.'
            exit 1
          fi
          test -f public/images/products/kr01-0001/02-pink-back.webp
          test -f public/images/products/kr01-0008/01-aqua-print.jpg
          test -f public/images/products/kr01-0011/08-detail-back-design.jpg
          test -f public/images/products/kr01-0012/08-detail-fabric-stretch.jpg
          npm ci
          npm run build

      - name: Commit repair to pull-request branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Gallery restoration is already applied.'
            exit 0
          fi
          git config user.name 'KARUU Engineering'
          git config user.email 'john@karuu.net'
          git add public src/data/products
          git commit -m 'Restore clean galleries and English product graphics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
