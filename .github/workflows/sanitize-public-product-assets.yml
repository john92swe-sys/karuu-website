name: Sanitize public product assets

on:
  push:
    branches:
      - agent/polish-public-product-copy
    paths:
      - .github/workflows/sanitize-public-product-assets.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/polish-public-product-copy
          fetch-depth: 0

      - name: Sanitize product sources and assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const repoRoot = process.cwd();
          const productDataDir = path.join(repoRoot, 'src/data/products');
          const productImageDir = path.join(repoRoot, 'public/images/products');
          const productFiles = fs
            .readdirSync(productDataDir)
            .filter((name) => /^kr01-\d{4}\.ts$/.test(name))
            .sort();
          const allowedImages = new Set();
          const hanPattern = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/u;

          function findMatching(source, start, openChar, closeChar) {
            let depth = 0;
            let quote = null;
            let escaped = false;

            for (let index = start; index < source.length; index += 1) {
              const char = source[index];

              if (quote) {
                if (escaped) {
                  escaped = false;
                } else if (char === '\\') {
                  escaped = true;
                } else if (char === quote) {
                  quote = null;
                }
                continue;
              }

              if (char === "'" || char === '"' || char === '`') {
                quote = char;
                continue;
              }

              if (char === openChar) depth += 1;
              if (char === closeChar) {
                depth -= 1;
                if (depth === 0) return index;
              }
            }

            throw new Error(`Unmatched ${openChar} in product source`);
          }

          function findTopLevelObjects(arrayContent) {
            const objects = [];
            let quote = null;
            let escaped = false;
            let depth = 0;
            let objectStart = -1;

            for (let index = 0; index < arrayContent.length; index += 1) {
              const char = arrayContent[index];

              if (quote) {
                if (escaped) {
                  escaped = false;
                } else if (char === '\\') {
                  escaped = true;
                } else if (char === quote) {
                  quote = null;
                }
                continue;
              }

              if (char === "'" || char === '"' || char === '`') {
                quote = char;
                continue;
              }

              if (char === '{') {
                if (depth === 0) objectStart = index;
                depth += 1;
              } else if (char === '}') {
                depth -= 1;
                if (depth === 0 && objectStart >= 0) {
                  objects.push(arrayContent.slice(objectStart, index + 1));
                  objectStart = -1;
                }
              }
            }

            return objects;
          }

          function removePropertyObject(source, propertyName) {
            const pattern = new RegExp(`\\n\\s*${propertyName}:\\s*\\{`, 'm');
            const match = pattern.exec(source);
            if (!match) return source;

            const propertyStart = match.index;
            const objectStart = source.indexOf('{', match.index);
            const objectEnd = findMatching(source, objectStart, '{', '}');
            let end = objectEnd + 1;
            while (end < source.length && /[ \t]/.test(source[end])) end += 1;
            if (source[end] === ',') end += 1;
            if (source[end] === '\r') end += 1;
            if (source[end] === '\n') end += 1;
            return source.slice(0, propertyStart) + '\n' + source.slice(end);
          }

          for (const fileName of productFiles) {
            const filePath = path.join(productDataDir, fileName);
            let source = fs.readFileSync(filePath, 'utf8');

            source = source
              .replace(/factoryCode:\s*(['"])[^'"]*\1/g, "factoryCode: ''")
              .replace(/factoryStyleNumber:\s*(['"])[^'"]*\1/g, "factoryStyleNumber: ''")
              .replace(/\bFactory style [A-Za-z0-9-]+ is\b/gi, 'This product is')
              .replace(/,\s*factory style [A-Za-z0-9-]+\s*/gi, ', ')
              .replace(/\bfactory style [A-Za-z0-9-]+\b/gi, 'this product')
              .replace(/\s{2,}/g, ' ')
              .replace(/\n /g, '\n  ');

            const galleryMatch = /gallery:\s*\[/.exec(source);
            if (!galleryMatch) throw new Error(`Missing gallery in ${fileName}`);
            const arrayStart = source.indexOf('[', galleryMatch.index);
            const arrayEnd = findMatching(source, arrayStart, '[', ']');
            const arrayContent = source.slice(arrayStart + 1, arrayEnd);
            const objects = findTopLevelObjects(arrayContent);
            let selectedObject = null;
            let selectedPath = null;

            for (const objectSource of objects) {
              const srcMatch = /src:\s*(['"])(.*?)\1/.exec(objectSource);
              if (!srcMatch) continue;
              let decoded = srcMatch[2];
              try {
                decoded = decodeURIComponent(decoded);
              } catch {
                // Use the original path when decoding fails.
              }
              if (!hanPattern.test(decoded)) {
                selectedObject = objectSource.trim();
                selectedPath = srcMatch[2];
                break;
              }
            }

            const replacementGallery = selectedObject
              ? `[\n    ${selectedObject.replace(/\n/g, '\n    ')}\n  ]`
              : '[]';
            source = source.slice(0, arrayStart) + replacementGallery + source.slice(arrayEnd + 1);
            source = removePropertyObject(source, 'sizeChart');

            if (selectedPath) {
              allowedImages.add(path.normalize(selectedPath.replace(/^\//, '')));
            }

            fs.writeFileSync(filePath, source, 'utf8');
          }

          function walk(directory) {
            if (!fs.existsSync(directory)) return [];
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(directory, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          for (const absolutePath of walk(productImageDir)) {
            const relativePath = path.normalize(path.relative(repoRoot, absolutePath));
            if (!allowedImages.has(relativePath)) {
              fs.unlinkSync(absolutePath);
            }
          }

          for (const allowedImage of allowedImages) {
            if (!fs.existsSync(path.join(repoRoot, allowedImage))) {
              throw new Error(`Selected public hero image is missing: ${allowedImage}`);
            }
          }

          console.log(`Sanitized ${productFiles.length} product records.`);
          console.log(`Retained ${allowedImages.size} public hero images.`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run build

      - name: Commit sanitized source and assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No sanitization changes required."
            exit 0
          fi
          git config user.name "KARUU Engineering"
          git config user.email "john@karuu.net"
          git add src/data/products public/images/products
          git commit -m "Remove supplier identifiers and non-hero product assets [sanitized]"
          git push origin HEAD:agent/polish-public-product-copy
