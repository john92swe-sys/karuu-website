name: Build C production information site
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/c-production-build.yml'
      - 'src/**'
      - 'cloudflare/**'
      - 'public/**'
      - 'scripts/build-cloudflare-production.mjs'
      - 'wrangler.production.jsonc'
      - 'next.config.js'
      - 'package*.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build with public safety, types and lint
        run: node scripts/build-cloudflare-production.mjs
      - name: Package exact production Worker and assets
        run: tar -cf karuu-c-production.tar .open-next cloudflare wrangler.production.jsonc package.json production-artifact-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: karuu-c-production-${{ github.event.pull_request.head.sha }}
          path: karuu-c-production.tar
          retention-days: 7
          compression-level: 0
